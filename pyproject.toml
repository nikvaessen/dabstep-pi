[project]
name = "dabstep"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".pi-task-work",
  ".ruff_cache",
  ".venv",
  "data",
  "runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["tools"]
exclude = [
  ".git",
  ".pi-task-work",
  ".ruff_cache",
  ".venv",
  "data",
  "runs",
]
